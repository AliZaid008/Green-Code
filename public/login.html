<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg"><meta name="theme-color" content="#06201d">
<title>Green Code</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=18"></head>
<body class="night" data-title="title_login" data-active="/">
<div class="top"><b data-i18n="brand"></b><div class="tools"><button class="lang" id="langbtn"></button><a class="back" href="/" data-i18n="home"></a></div></div>
<main class="wrap" style="max-width:480px"><div class="gcard">
<div class="tabs"><button id="tin" class="on" data-i18n="tab_in"></button><button id="tup" data-i18n="tab_up"></button></div>
<form id="f" novalidate>
<div id="upf" hidden><label data-i18n="r_name"></label><input name="name" autocomplete="name" maxlength="80"><label data-i18n="r_phone"></label><input name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
<label data-i18n="r_email"></label><input name="email" type="email" autocomplete="email" required>
<label data-i18n="r_pass"></label><input name="password" type="password" autocomplete="current-password" minlength="8" required>
<div id="pubrow" hidden><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="public" checked><span data-i18n="r_public"></span></label></div>
<button class="cta full" id="go" type="submit"></button><div class="msg" id="msg"></div>
</form></div></main>
<script src="/config.js?v=18"></script><script src="/js/common.js?v=18"></script><script src="/js/login.js?v=18"></script></body></html>
