<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg"><meta name="theme-color" content="#06201d">
<title>Green Code</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=21"><link rel="stylesheet" href="/css/map.css?v=21"></head>
<body class="night mappage" data-title="title_map">
<div class="top"><b data-i18n="brand_map"></b><div class="tools"><button class="lang" id="langbtn"></button><a class="back" href="/" data-i18n="home"></a></div></div>
<div class="mapwrap" id="mapwrap">
  <div id="map" class="gcm" tabindex="0" role="application" data-i18n-aria="m_map_label"></div>
  <div class="gcm-ui ctrls" id="ctrls"></div>
  <canvas id="v3d" class="v3d" hidden aria-label="3D"></canvas>
  <div class="gcm-ui tip" id="tip" hidden></div>
  <div class="gcm-ui pop" id="pop" hidden></div>
  <div class="gcm-ui attr" id="attr"></div>
  <div class="gcm-ui lsym" id="lsym"></div>
  <aside id="panel" class="gcm-ui panel" data-snap="half">
    <button class="grab" id="grab" type="button" aria-label="resize"></button>
    <div class="ptabs" role="tablist" id="ptabs"></div>
    <div id="pfilters" class="pfilters"></div>
    <div id="plist" class="plist"></div>
  </aside>
  <aside id="drawer" class="gcm-ui drawer" role="dialog" aria-labelledby="dtitle" aria-hidden="true"></aside>
  <div id="lightbox" class="gcm-ui lightbox" hidden></div>
</div>
<script src="/config.js?v=21"></script><script src="/js/common.js?v=21"></script><script src="/js/iraq3d.js?v=21"></script><script src="/js/gcmap.js?v=21"></script><script src="/js/map.js?v=21"></script></body></html>
