# نشر مجاني على Render (بدون بطاقة). البيانات والصور على Supabase المجاني.
services:
  - type: web
    name: green-code-iraq
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_KEY, sync: false }
      - { key: ADMIN_KEY, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: AUTO_PUBLISH_LEVEL, value: "0" }
      - { key: BASE_URL, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_CHAT_ID, sync: false }
